[project]
name = "investmentcopilot-backend"
version = "0.1.0"
description = "Investment copilot backend: portfolio ingestion, analytics, market data, AI analyst"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "anthropic>=0.49",
    "pandas>=2.0",
    "numpy>=1.26",
    "lxml>=5.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
